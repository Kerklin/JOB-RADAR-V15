name: Job Radar V15
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: job-radar-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install browser dependency
        run: |
          python3 -m pip install playwright==1.64.1
          python3 -m playwright install --with-deps chromium
      - name: Regression tests
        run: python3 radar.py test
      - name: Build dashboard
        run: python3 radar.py
        env:
          PREVIOUS_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/jobs.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v5
